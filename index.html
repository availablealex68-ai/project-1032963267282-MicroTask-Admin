<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - MicroTask Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { adminBg: '#0f172a', adminCard: '#1e293b', adminPrimary: '#6366f1' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-active { border-bottom: 2px solid #6366f1; color: #818cf8; }
        .admin-page { display: none; }
        .admin-page.active { display: block; animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="flex justify-center h-screen w-full overflow-hidden relative">

    <div id="global-loader" class="fixed inset-0 z-[200] bg-[#0f172a] flex items-center justify-center">
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-spinner animate-spin text-4xl text-indigo-500 mb-3"></i>
            <p class="text-sm font-bold text-slate-400">Verifying Admin Database Access...</p>
        </div>
    </div>

    <!-- 1. ADMIN LOGIN SECTION -->
    <div id="auth-container" class="hidden w-full max-w-md h-full flex-col justify-center px-6 relative z-40 fade-in">
        <div class="flex flex-col items-center mb-8">
            <div class="h-16 w-16 rounded-2xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4">
                <i class="fa-solid fa-shield-halved text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">Admin Portal</h1>
            <p class="text-sm text-slate-400 mt-1">Authorized Personnel Only</p>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-2xl border border-slate-700 shadow-xl">
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs font-bold text-slate-400 mb-1 block">Admin Email</label>
                    <div class="relative flex items-center bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 focus-within:border-indigo-500 transition-colors">
                        <i class="fa-solid fa-envelope text-slate-500 w-6"></i>
                        <input type="email" id="admin-email" placeholder="Database secured email" class="w-full bg-transparent text-sm focus:outline-none text-white placeholder-slate-600 ml-2">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 mb-1 block">Password</label>
                    <div class="relative flex items-center bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 focus-within:border-indigo-500 transition-colors">
                        <i class="fa-solid fa-lock text-slate-500 w-6"></i>
                        <input type="password" id="admin-password" placeholder="••••••••" class="w-full bg-transparent text-sm focus:outline-none text-white placeholder-slate-600 ml-2">
                    </div>
                </div>
            </div>
            <button id="btn-admin-login" onclick="loginAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/20 active:scale-95 transition-all text-sm flex justify-center items-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> <span>Secure Login</span>
            </button>
        </div>
    </div>

    <!-- 2. MAIN ADMIN DASHBOARD -->
    <div id="admin-app-container" class="w-full max-w-md h-full relative flex flex-col hidden bg-[#0f172a]">
        
        <!-- Header -->
        <header class="p-5 flex justify-between items-center z-10 border-b border-slate-800 bg-[#1e293b]">
            <div class="flex items-center gap-3">
                <div class="h-10 w-10 bg-indigo-600/20 border border-indigo-500/50 rounded-lg flex items-center justify-center text-indigo-400"><i class="fa-solid fa-user-shield"></i></div>
                <div><h1 class="text-sm font-bold text-white leading-tight">Admin Control</h1><p class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider">Database Connected</p></div>
            </div>
            <button onclick="logoutAdmin()" class="h-9 px-3 rounded-lg bg-rose-500/10 text-rose-500 border border-rose-500/20 flex items-center justify-center text-xs font-bold hover:bg-rose-500/20 transition-colors"><i class="fa-solid fa-power-off mr-1"></i> Logout</button>
        </header>

        <!-- Tabs -->
        <div class="flex bg-[#1e293b] border-b border-slate-800 px-2 pt-2">
            <button onclick="switchAdminTab('dashboard')" class="admin-nav-item nav-active flex-1 py-3 text-xs font-bold text-slate-400 transition-colors"><i class="fa-solid fa-chart-pie mr-1"></i> Dash</button>
            <button onclick="switchAdminTab('kyc')" class="admin-nav-item flex-1 py-3 text-xs font-bold text-slate-400 transition-colors relative"><i class="fa-solid fa-id-card mr-1"></i> KYC <span id="kyc-badge" class="hidden absolute top-2 right-2 h-2 w-2 bg-rose-500 rounded-full"></span></button>
            <button onclick="switchAdminTab('withdraw')" class="admin-nav-item flex-1 py-3 text-xs font-bold text-slate-400 transition-colors relative"><i class="fa-solid fa-money-bill-transfer mr-1"></i> Withdraw <span id="withdraw-badge" class="hidden absolute top-2 right-1 h-2 w-2 bg-amber-500 rounded-full"></span></button>
        </div>

        <main class="flex-1 overflow-y-auto px-5 pt-5 pb-10 relative">
            
            <!-- DASHBOARD PAGE -->
            <section id="page-dashboard" class="admin-page active">
                <h2 class="font-bold text-lg mb-4 text-white">Live Database Stats</h2>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-[#1e293b] p-4 rounded-2xl border border-rose-900/30 shadow-sm text-center">
                        <i class="fa-solid fa-id-badge text-rose-400 mb-2 text-2xl"></i>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Pending KYC</p>
                        <p id="stat-kyc" class="font-bold text-3xl text-rose-400 mt-1">0</p>
                    </div>
                    <div class="bg-[#1e293b] p-4 rounded-2xl border border-amber-900/30 shadow-sm text-center">
                        <i class="fa-solid fa-hand-holding-dollar text-amber-400 mb-2 text-2xl"></i>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Pending Withdrawals</p>
                        <p id="stat-withdraw" class="font-bold text-3xl text-amber-400 mt-1">0</p>
                    </div>
                </div>
            </section>

            <!-- KYC REVIEW PAGE -->
            <section id="page-kyc" class="admin-page">
                <h2 class="font-bold text-lg mb-4 text-white">Pending KYC Requests</h2>
                <div id="kyc-list" class="space-y-4">
                    <p class="text-sm text-slate-500 text-center mt-10">No pending KYC requests from Database.</p>
                </div>
            </section>

            <!-- WITHDRAW PAGE -->
            <section id="page-withdraw" class="admin-page">
                <h2 class="font-bold text-lg mb-4 text-white">Withdrawal Requests</h2>
                <div id="withdraw-list" class="space-y-4">
                    <p class="text-sm text-slate-500 text-center mt-10">No pending withdrawals from Database.</p>
                </div>
            </section>

        </main>
    </div>

    <!-- Scripts for UI Tabs -->
    <script>
        function switchAdminTab(tabId) {
            document.querySelectorAll('.admin-page').forEach(page => page.classList.remove('active'));
            document.getElementById('page-' + tabId).classList.add('active');
            document.querySelectorAll('.admin-nav-item').forEach(item => {
                item.classList.remove('nav-active'); item.classList.add('text-slate-400');
            });
            event.currentTarget.classList.add('nav-active'); event.currentTarget.classList.remove('text-slate-400');
        }
        function setButtonLoading(id, isLoading, defaultText, iconClass) {
            const btn = document.getElementById(id);
            if (isLoading) { btn.disabled = true; btn.classList.add('opacity-70', 'cursor-not-allowed'); btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Verifying...</span>`; } 
            else { btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-not-allowed'); btn.innerHTML = `<i class="${iconClass}"></i> <span>${defaultText}</span>`; }
        }
    </script>

    <!-- FIREBASE DB & AUTH API SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // মেইন অ্যাপের একই ফায়ারবেস কনফিগারেশন এখানে ব্যবহার করুন
        const firebaseConfig = {
            apiKey: "AIzaSyDB7fXgHjnMA2wQwmvU4eOycHjiRIoVn5U",
            authDomain: "microtask-pro-bb3a0.firebaseapp.com",
            projectId: "microtask-pro-bb3a0",
            storageBucket: "microtask-pro-bb3a0.firebasestorage.app",
            messagingSenderId: "1032963267282",
            appId: "1:1032963267282:web:a5ec4fba2699c32922ab0b",
            measurementId: "G-1H11MKMNLP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Persistent Login & DB Rule Checker
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // এটি ডেটাবেস থেকে চেক করবে সে রুলসে দেওয়া অ্যাডমিন কি না!
                    const q = collection(db, "admin_check");
                    await getDocs(q); 
                    
                    // Error না দিলে সে আসল অ্যাডমিন!
                    document.getElementById('global-loader').style.display = 'none';
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('admin-app-container').classList.remove('hidden');
                    
                    // Load Live Data from Firestore
                    loadDatabaseLive();

                } catch (error) {
                    // ডাটাবেস এরর দিলে মানে সে হ্যাকার বা সাধারণ ইউজার! কিক আউট!
                    auth.signOut().then(() => {
                        document.getElementById('global-loader').style.display = 'none';
                        document.getElementById('auth-container').style.display = 'flex';
                        alert("Access Denied! You are not authorized by the Database Security Rules.");
                    });
                }
            } else {
                document.getElementById('global-loader').style.display = 'none';
                document.getElementById('admin-app-container').classList.add('hidden');
                document.getElementById('auth-container').style.display = 'flex';
            }
        });

        window.logoutAdmin = () => { signOut(auth).then(() => { window.location.reload(); }); };

        window.loginAdmin = () => {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            if(!email || !password) return alert("Enter admin email and password!");
            
            setButtonLoading('btn-admin-login', true);

            signInWithEmailAndPassword(auth, email, password).catch((error) => {
                setButtonLoading('btn-admin-login', false, 'Secure Login', 'fa-solid fa-right-to-bracket');
                alert("Login Failed: Incorrect credentials.");
            });
        };

        // ==========================================
        // REAL-TIME DATABASE FETCHING (Firestore)
        // ==========================================
        function loadDatabaseLive() {
            // Live listener for KYC Requests
            onSnapshot(collection(db, "kyc_requests"), (snapshot) => {
                const list = document.getElementById('kyc-list');
                const badge = document.getElementById('kyc-badge');
                document.getElementById('stat-kyc').innerText = snapshot.size;
                
                if(snapshot.empty) {
                    list.innerHTML = `<p class="text-sm text-slate-500 text-center mt-10">No pending KYC requests from Database.</p>`;
                    badge.classList.add('hidden');
                } else {
                    badge.classList.remove('hidden');
                    let html = '';
                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        html += `
                        <div class="bg-[#1e293b] p-4 rounded-2xl border border-slate-700 shadow-sm fade-in" id="kyc-card-${docSnap.id}">
                            <div class="flex justify-between items-start mb-3">
                                <div><h3 class="font-bold text-sm text-white">${data.name}</h3><p class="text-xs text-slate-400">${data.email}</p></div>
                                <span class="text-[10px] font-bold bg-amber-500/20 text-amber-400 px-2 py-1 rounded">Pending DB</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="approveKycDB('${docSnap.id}')" class="flex-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 py-2 rounded-lg text-xs font-bold transition-colors">Approve</button>
                                <button onclick="rejectKycDB('${docSnap.id}')" class="flex-1 bg-rose-600/20 text-rose-400 border border-rose-500/30 py-2 rounded-lg text-xs font-bold transition-colors">Reject</button>
                            </div>
                        </div>`;
                    });
                    list.innerHTML = html;
                }
            });

            // Live listener for Withdrawals
            const qWithdraw = query(collection(db, "withdrawals"), where("status", "==", "pending"));
            onSnapshot(qWithdraw, (snapshot) => {
                const list = document.getElementById('withdraw-list');
                const badge = document.getElementById('withdraw-badge');
                document.getElementById('stat-withdraw').innerText = snapshot.size;
                
                if(snapshot.empty) {
                    list.innerHTML = `<p class="text-sm text-slate-500 text-center mt-10">No pending withdrawals from Database.</p>`;
                    badge.classList.add('hidden');
                } else {
                    badge.classList.remove('hidden');
                    let html = '';
                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        html += `
                        <div class="bg-[#1e293b] p-4 rounded-2xl border border-slate-700 shadow-sm fade-in" id="wd-card-${docSnap.id}">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-700 pb-3">
                                <div class="flex items-center gap-3">
                                    <div class="h-10 w-10 rounded-full bg-cyan-900/30 text-cyan-400 flex items-center justify-center"><i class="fa-solid fa-money-bill-transfer"></i></div>
                                    <div><h3 class="font-bold text-sm text-white">${data.email}</h3><p class="text-[10px] text-amber-400">Pending DB</p></div>
                                </div>
                                <h2 class="text-lg font-bold text-white">৳ ${data.amount}</h2>
                            </div>
                            <div class="mb-4">
                                <p class="text-xs text-slate-400 mb-1">Method: <strong class="text-white capitalize">${data.method}</strong></p>
                                <p class="text-xs text-slate-400">Account: <strong class="text-cyan-400 bg-cyan-900/20 px-2 py-0.5 rounded select-all">${data.account}</strong></p>
                            </div>
                            <button onclick="approveWithdrawDB('${docSnap.id}')" class="w-full bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 py-2 rounded-lg text-xs font-bold transition-colors"><i class="fa-solid fa-check mr-1"></i> Mark as Paid in DB</button>
                        </div>`;
                    });
                    list.innerHTML = html;
                }
            });
        }

        // Action Functions (Global for HTML buttons)
        window.approveKycDB = async (uid) => {
            try {
                // মেইন ইউজার কালেকশনে KYC স্ট্যাটাস আপডেট করবে
                await updateDoc(doc(db, "users", uid), { kycVerified: true });
                // রিকোয়েস্ট লিস্ট থেকে মুছে ফেলবে
                await deleteDoc(doc(db, "kyc_requests", uid));
                alert("KYC Approved & Saved to Database!");
            } catch(e) { alert("Error updating Database: " + e.message); }
        }

        window.rejectKycDB = async (uid) => {
            try {
                await deleteDoc(doc(db, "kyc_requests", uid));
                alert("KYC Rejected and deleted from Database.");
            } catch(e) { alert("Error updating Database: " + e.message); }
        }

        window.approveWithdrawDB = async (docId) => {
            try {
                await updateDoc(doc(db, "withdrawals", docId), { status: 'paid' });
                alert("Withdrawal marked as Paid in Database!");
            } catch(e) { alert("Error updating Database: " + e.message); }
        }
    </script>
</body>
</html>
